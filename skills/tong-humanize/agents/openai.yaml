interface:
  display_name: "Tong Humanize"
  short_description: "写文章或去 AI 味：扫描套话/三毒/标点，按栏目交稿"
  default_prompt: >-
    Use $tong-humanize to pick a lane, then write a new piece or rewrite a
    draft. Run the bundled scan.py and re-scan until the gate passes. Humanize
    is the delivery gate, not a separate user command. Do not invent facts or
    swap in another writer's voice.
policy:
  allow_implicit_invocation: true
